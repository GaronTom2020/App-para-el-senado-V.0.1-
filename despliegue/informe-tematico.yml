# Publica informes temáticos actualizados en GitHub Pages.
#
# Cómo usarlo:
#  1. Copiá la carpeta del programa (informe_expedientes, con app.py y requirements.txt)
#     a la raíz del repositorio del sitio.
#  2. Copiá este archivo a .github/workflows/informe-tematico.yml.
#  3. En Settings → Actions → General, dale permiso de escritura al workflow
#     ("Read and write permissions").
#  4. Ajustá EJES y la carpeta de destino (DESTINO) a la estructura del sitio.
#     Cada eje queda publicado en DESTINO/<nombre-del-eje>/index.html (y .xlsx).
#  5. Para probarlo sin esperar al horario: Actions → Informes temáticos → Run workflow.
#
# Ejes propios del equipo: guardá un ejes.json en el repositorio y agregá
# --ejes ../ejes.json a la línea de python app.py.
#
# Páginas por bloque: el segundo paso publica DESTINO/bloques/index.html (el índice) y una
# página por bloque en DESTINO/bloques/<bloque>/index.html, con los proyectos que llevan la
# firma de alguno de sus integrantes actuales. BLOQUES puede ser "todos" o una lista separada
# por punto y coma ("Justicialista;La Libertad Avanza"); EJE_BLOQUES, si no está vacío, limita
# las páginas a un eje temático. Cada senador es una consulta por año: con todos los bloques
# son unas 72 consultas por año más las fichas, por eso conviene acotar con --tipos.
# Para no publicar páginas por bloque, dejá BLOQUES vacío.

name: Informes temáticos

on:
  schedule:
    - cron: "0 11 * * 1-5"      # lunes a viernes, 8:00 de Buenos Aires (11:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: informes-tematicos
  cancel-in-progress: false

jobs:
  informes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DESTINO: informes
      EJES: "Educación y universidades;Salud;Transferencia de inmuebles"
      BLOQUES: "todos"
      EJE_BLOQUES: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el programa
        run: pip install -r informe_expedientes/requirements.txt

      - name: Generar los informes
        working-directory: informe_expedientes
        run: |
          ANIO=$(date +%Y); DESDE=$((ANIO - 1))
          IFS=';' read -ra LISTA <<< "$EJES"
          for EJE in "${LISTA[@]}"; do
            CARPETA="../$DESTINO/$(echo "$EJE" | iconv -f utf-8 -t ascii//TRANSLIT | tr 'A-Z ' 'a-z-')"
            python app.py --tema "$EJE" --anios "$DESDE-$ANIO" --formatos html,xlsx \
                          --nombre index --salida "$CARPETA" --sin-cache
          done

      - name: Generar una página por bloque
        if: env.BLOQUES != ''
        working-directory: informe_expedientes
        run: |
          ANIO=$(date +%Y)
          EXTRA=()
          if [ "$BLOQUES" != "todos" ]; then EXTRA+=(--bloque "$BLOQUES"); fi
          if [ -n "$EJE_BLOQUES" ]; then EXTRA+=(--tema "$EJE_BLOQUES"); fi
          python app.py --por-bloque "${EXTRA[@]}" --tipos PL --anios "$ANIO" --formatos html,xlsx \
                        --salida "../$DESTINO/bloques" --sin-cache

      - name: Publicar los cambios
        run: |
          git config user.name "informes-bot"
          git config user.email "informes-bot@users.noreply.github.com"
          git add "$DESTINO"
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Informes temáticos $(date +%F)"
            git push
          fi
