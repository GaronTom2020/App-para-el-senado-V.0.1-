name: Manual de usuario

# Compila el manual en PDF con el README vigente y capturas nuevas del programa. Corre al cambiar el README,
# el manual o el programa en main, y a mano desde la pestaña Actions. El PDF queda como artefacto y en la
# versión «manual» de Releases, siempre en la misma dirección:
#   https://github.com/<usuario>/<repositorio>/releases/download/manual/Manual-de-usuario.pdf

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - README.md
      - manual/**
      - informe_expedientes/**
      - .github/workflows/manual.yml

permissions:
  contents: write

concurrency:
  group: manual
  cancel-in-progress: true

jobs:
  manual:
    runs-on: windows-latest          # para las capturas de la ventana y las fuentes Cambria y Calibri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt pytest markdown pymupdf playwright pillow
          python -m playwright install chromium

      # La pantalla del runner es chica para la ventana de 1280 × 800: sin esto, las capturas salen cortadas.
      - name: Pantalla de 1920 × 1080
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Capturas del programa
        # Si el escritorio del runner no permite capturar, se usan las de manual/capturas del repositorio, y la
        # ejecución lo avisa en amarillo: en ese caso, si cambió la ventana, hay que tomarlas en una PC con
        # «python manual/capturar.py» y subirlas.
        shell: bash
        run: |
          timeout 300 python -u manual/capturar.py || echo "::warning::No se pudieron tomar las capturas en GitHub: el manual usa las de manual/capturas. Si cambió la ventana, tomalas en una PC con «python manual/capturar.py» y subilas."

      - name: Compilar el manual
        run: python manual/construir_manual.py --nombre Manual-de-usuario

      # Sin comprimir: se descarga el PDF suelto, no un .zip.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: manual/salida/Manual-de-usuario.pdf
          archive: false

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view manual >/dev/null 2>&1 || gh release create manual --title "Manual de usuario" \
            --notes "Manual de usuario en PDF, compilado automáticamente con la última versión del README."
          gh release upload manual manual/salida/Manual-de-usuario.pdf --clobber
