name: Pruebas

# Corre las pruebas en cada PR y en cada cambio de main. En la regla de main, «Require status checks to
# pass» con el chequeo «pruebas» impide unir un PR que las rompa.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest

      - name: Correr las pruebas
        run: python -m pytest -q
