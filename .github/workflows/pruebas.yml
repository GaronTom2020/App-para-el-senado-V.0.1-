name: Pruebas

# Corre las pruebas en cada PR y en cada cambio de main. En la regla de main, «Require status checks to
# pass» con el chequeo «pruebas» impide unir un PR que las rompa.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest

      - name: Correr las pruebas
        run: python -m pytest -q
