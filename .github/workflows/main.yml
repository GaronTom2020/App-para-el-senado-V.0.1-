name: Compilar InformeExpediente.exe

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar la estructura del repositorio
        shell: bash
        run: |
          for f in app.py requirements.txt informe_expedientes/__init__.py tests/conftest.py tests/fixtures/buscador.html; do
            if [ ! -f "$f" ]; then
              echo "::error::Falta $f. Subí las carpetas informe_expedientes y tests completas, arrastrándolas desde el Explorador."
              exit 1
            fi
          done

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Correr las pruebas
        run: python -m pytest -q

      # La versión es la de informe_expedientes/__init__.py, con el esquema de la oficina: lanzamiento.función.parche
      # (1.1.2). Cada PR sube su número (una función nueva sube el del medio; un arreglo, el último). Si esa versión
      # ya está publicada, no se vuelve a publicar: hay que subir el número antes de compilar.
      - name: Versión
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import informe_expedientes as m; print(m.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versión: $VERSION"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::La versión $VERSION ya está publicada. Subí el número en informe_expedientes/__init__.py (por ejemplo, el último: un arreglo) y volvé a compilar."
            exit 1
          fi

      # El manual viaja dentro del .exe (Ayuda → Manual de usuario); si todavía no se publicó, se abre el de Releases.
      - name: Incluir el manual de usuario
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download manual --pattern Manual-de-usuario.pdf --dir informe_expedientes/recursos --clobber \
            || echo "::warning::No se encontró el manual publicado; el programa abrirá el de Releases."

      - name: Compilar
        shell: bash
        run: |
          extra=()
          for f in Manual-de-usuario.pdf; do
            if [ -f "informe_expedientes/recursos/$f" ]; then
              extra+=(--add-data "informe_expedientes/recursos/$f;informe_expedientes/recursos")
            fi
          done
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name InformeExpediente --collect-submodules informe_expedientes --collect-data docx \
            --hidden-import lxml.etree --hidden-import lxml._elementpath \
            --icon informe_expedientes/recursos/icono.ico \
            --add-data "informe_expedientes/recursos/icono.ico;informe_expedientes/recursos" \
            --add-data "informe_expedientes/recursos/logo_senado.png;informe_expedientes/recursos" \
            "${extra[@]}" app.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/InformeExpediente.exe
          archive: false

      # Cada compilación queda en Releases como «v0.4.0.17»: el programa la encuentra al abrir y ofrece instalarla.
      - name: Publicar la versión en Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/InformeExpediente.exe --title "Versión $VERSION" \
            --notes "Descargá InformeExpediente.exe y reemplazá el anterior, o aceptá la actualización desde el programa." \
            --generate-notes
